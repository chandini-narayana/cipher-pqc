<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="400" y="34" font-size="14.5" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">CONNECT THE SINGLE USB Wi-Fi ADAPTER</text><rect x="50" y="70" width="270" height="150" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="185.0" y="139.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Raspberry Pi 4</text><text x="185.0" y="159.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">powered on, management Wi-Fi active</text><rect x="65" y="176" width="157.64799999999997" height="16" rx="8.0" ry="8.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><circle cx="80" cy="184.0" r="3.2" fill="#16a34a" stroke="none" stroke-width="2"/><text x="90" y="188.0" font-size="7.6" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MANAGEMENT LINK UP</text><line x1="320" y1="145" x2="410" y2="145" stroke="#0a1628" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="365" y="128" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">USB</text><rect x="410" y="110" width="90" height="70" rx="6" ry="6" fill="#1d4ed8" stroke="#0b1f4d" stroke-width="2"/><text x="455" y="150" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">USB</text><line x1="500" y1="145" x2="570" y2="145" stroke="#0a1628" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="570" y="70" width="190" height="150" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="665.0" y="139.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">USB Wi-Fi Adapter</text><text x="665.0" y="159.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">monitor-mode capable</text><text x="60" y="260" font-size="11.5" font-weight="700" font-style="normal" fill="#0a1628" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">1. Connect the single USB Wi-Fi adapter to any free USB port.</text><text x="60" y="282" font-size="11.5" font-weight="700" font-style="normal" fill="#0a1628" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">2. Identify it from an SSH session:</text><rect x="60" y="296" width="640" height="92" rx="6" ry="6" fill="#0a1628" stroke="#0a1628" stroke-width="0"/><text x="78" y="320" font-size="13" font-weight="600" font-style="normal" fill="#d7ecf5" text-anchor="start" font-family="Consolas, 'Courier New', monospace">lsusb</text><text x="78" y="344" font-size="13" font-weight="600" font-style="normal" fill="#d7ecf5" text-anchor="start" font-family="Consolas, 'Courier New', monospace">ip link</text><text x="78" y="368" font-size="13" font-weight="600" font-style="normal" fill="#d7ecf5" text-anchor="start" font-family="Consolas, 'Courier New', monospace">iw dev</text><text x="60" y="424" font-size="10.8" font-weight="700" font-style="normal" fill="#7c2d12" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Do not assume an interface name — record the actual name shown.</text></svg>