<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="380.0" y="34" font-size="14.5" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">FIRST HEADLESS BOOT</text><rect x="120.0" y="60" width="520" height="58" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="83.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Insert microSD → power on the Pi</text><text x="380.0" y="103.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">no monitor or keyboard attached</text><circle cx="96.0" cy="89.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="94.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">1</text><line x1="380.0" y1="118" x2="380.0" y2="144" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="144" width="520" height="58" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="167.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Find the Pi on the trusted network</text><text x="380.0" y="187.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">router client list, or the configured hostname</text><circle cx="96.0" cy="173.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="178.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">2</text><line x1="380.0" y1="202" x2="380.0" y2="228" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="228" width="520" height="58" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="251.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Connect over SSH</text><text x="380.0" y="271.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">from the Windows laptop, using the configured user</text><circle cx="96.0" cy="257.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="262.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">3</text><line x1="380.0" y1="286" x2="380.0" y2="312" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="312" width="520" height="58" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="335.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Verify the OS</text><text x="380.0" y="355.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">confirm Raspberry Pi OS 64-bit is running</text><circle cx="96.0" cy="341.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="346.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">4</text><line x1="380.0" y1="370" x2="380.0" y2="396" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="396" width="520" height="58" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="419.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Verify the IP address</text><text x="380.0" y="439.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">record it for dashboard access later</text><circle cx="96.0" cy="425.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="430.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">5</text></svg>