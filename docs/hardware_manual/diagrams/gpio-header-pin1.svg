"475" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="220" cy="498" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="310" cy="498" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="220" cy="521" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="310" cy="521" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="220" cy="544" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="310" cy="544" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="220" cy="567" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><circle cx="310" cy="567" r="6.8" fill="#e5e7eb" stroke="#111827" stroke-width="1.3"/><text x="165" y="134" font-size="12" font-weight="900" font-style="normal" fill="#dc2626" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">1</text><text x="365" y="134" font-size="12" font-weight="900" font-style="normal" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">2</text><text x="165" y="571" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">39</text><text x="365" y="571" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">40</text><text x="70" y="627" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Pin 1 sits at the corner of the 40-pin header nearest the USB-C power</text><text x="70" y="647" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">connector (a square solder pad on the underside marks Pin 1 on every</text><text x="70" y="667" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Raspberry Pi board). Physical pin numbers count left-right, top-to-</text><text x="70" y="687" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">bottom: 1, 2 in the top row, down to 39, 40 at the far end.</text><rect x="70" y="723" width="363.36" height="20" rx="10.0" ry="10.0" fill="#e0f2fe" stroke="#0891b2" stroke-width="1.6"/><circle cx="85" cy="733.0" r="3.2" fill="#0891b2" stroke="none" stroke-width="2"/><text x="95" y="737.0" font-size="9.4" font-weight="800" font-style="normal" fill="#0891b2" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">PORT / PIN-1 LOCATION: FACTUAL REFERENCE</text><rect x="70" y="755" width="680" height="76" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="90" y="781" font-size="10.4" font-weight="700" font-style="normal" fill="#7f1d1d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">This shows the physical header only — it does NOT show which pins CIPHER&#x27;s</text><text x="90" y="799" font-size="10.4" font-weight="700" font-style="normal" fill="#7f1d1d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">OLED or LEDs use. See “GPIO Assignment — Pending Final Approval” before</text><text x="90" y="817" font-size="10.4" font-weight="700" font-style="normal" fill="#7f1d1d" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">connecting anything here.</text></svg>