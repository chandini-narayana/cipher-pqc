<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="390" y="30" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">LED WIRING CONCEPT — GPIO PIN TO BE ASSIGNED</text><rect x="60" y="70" width="150" height="60" rx="10" ry="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/><text x="135.0" y="94.0" font-size="13" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">GPIO pin</text><text x="135.0" y="114.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">(TBD)</text><line x1="210" y1="100" x2="320" y2="100" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="330" y="78" width="100" height="44" rx="6" ry="6" fill="#f5deb3" stroke="#0a1628" stroke-width="2"/><rect x="340" y="78" width="8" height="44" rx="10" ry="10" fill="#8b4513" stroke="none" stroke-width="2"/><rect x="360" y="78" width="8" height="44" rx="10" ry="10" fill="#000000" stroke="none" stroke-width="2"/><rect x="380" y="78" width="8" height="44" rx="10" ry="10" fill="#dc2626" stroke="none" stroke-width="2"/><rect x="400" y="78" width="8" height="44" rx="10" ry="10" fill="#d4af37" stroke="none" stroke-width="2"/><text x="380" y="140" font-size="11" font-weight="700" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">resistor</text><line x1="430" y1="100" x2="520" y2="100" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="560" cy="100" r="30" fill="#d97706" stroke="#0a1628" stroke-width="2.5"/><text x="560" y="106" font-size="12" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">LED</text><line x1="590" y1="100" x2="680" y2="100" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="680" y="70" width="100" height="60" rx="10" ry="10" fill="#e5e7eb" stroke="#0a1628" stroke-width="2.2"/><text x="730.0" y="105.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">GND</text><text x="60" y="200" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">GPIO → resistor → LED (anode) → LED (cathode) → GND</text><text x="60" y="222" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif"></text><text x="60" y="244" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• Repeat once per LED colour (green / amber / red) once GPIO pins are approved.</text><text x="60" y="266" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• Never connect an LED directly to a GPIO pin without a resistor.</text><text x="60" y="288" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">• Confirm LED polarity (long leg / flat side) before connecting.</text><rect x="60" y="300" width="660" height="46" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="390" y="328" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Exact GPIO pin numbers are NOT assigned yet — see “GPIO Assignment — Pending”</text></svg>