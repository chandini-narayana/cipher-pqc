<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 684" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="380.0" y="34" font-size="14.5" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">MICROSD / OS SETUP — FROM WINDOWS</text><rect x="120.0" y="60" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="82.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Raspberry Pi Imager (Windows)</text><text x="380.0" y="102.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">official Raspberry Pi flashing tool</text><circle cx="96.0" cy="88.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="93.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">1</text><line x1="380.0" y1="116" x2="380.0" y2="138" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="138" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="160.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Choose OS: Raspberry Pi OS (64-bit)</text><text x="380.0" y="180.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">matches the ARM64 / Pi 4 target</text><circle cx="96.0" cy="166.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="171.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">2</text><line x1="380.0" y1="194" x2="380.0" y2="216" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="216" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="238.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Configure hostname</text><text x="380.0" y="258.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">e.g. a name you will recognize on the LAN</text><circle cx="96.0" cy="244.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="249.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">3</text><line x1="380.0" y1="272" x2="380.0" y2="294" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="294" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="316.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Enable SSH</text><text x="380.0" y="336.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">so no monitor/keyboard is ever required</text><circle cx="96.0" cy="322.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="327.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">4</text><line x1="380.0" y1="350" x2="380.0" y2="372" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="372" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="394.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Configure user credentials</text><text x="380.0" y="414.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">set your own username + password — never hardcoded</text><circle cx="96.0" cy="400.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="405.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">5</text><line x1="380.0" y1="428" x2="380.0" y2="450" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="450" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="472.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Configure management Wi-Fi (if required)</text><text x="380.0" y="492.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">your trusted network&#x27;s SSID/credentials</text><circle cx="96.0" cy="478.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="483.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">6</text><line x1="380.0" y1="506" x2="380.0" y2="528" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="528" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="550.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Write the card</text><text x="380.0" y="570.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Imager flashes + verifies the microSD card</text><circle cx="96.0" cy="556.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="561.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">7</text><line x1="380.0" y1="584" x2="380.0" y2="606" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120.0" y="606" width="520" height="56" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="380.0" y="628.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Safely eject the microSD card</text><text x="380.0" y="648.0" font-size="10" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">before removing it from the laptop</text><circle cx="96.0" cy="634.0" r="16" fill="#22d3ee" stroke="#0a1628" stroke-width="2"/><text x="96.0" y="639.0" font-size="14" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">8</text></svg>