<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="410" y="34" font-size="14.5" font-weight="900" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">TWO WI-FI ROLES — EXACTLY ONE EXTERNAL ADAPTER</text><rect x="60" y="80" width="320" height="100" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="220.0" y="124.0" font-size="15" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Raspberry Pi 4</text><text x="220.0" y="144.0" font-size="11" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Built-in Wi-Fi (on-board)</text><rect x="75" y="168" width="150.94" height="18" rx="9.0" ry="9.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><circle cx="90" cy="177.0" r="3.2" fill="#16a34a" stroke="none" stroke-width="2"/><text x="100" y="181.0" font-size="8.6" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MANAGEMENT ROLE</text><line x1="220" y1="182" x2="220" y2="236" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="60" y="240" width="320" height="84" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="220.0" y="276.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">SSH + Dashboard</text><text x="220.0" y="296.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">to/from Windows laptop</text><rect x="440" y="80" width="320" height="100" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="600.0" y="124.0" font-size="15" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">External USB Wi-Fi Adapter</text><text x="600.0" y="144.0" font-size="11" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">monitor-mode capable (exactly one)</text><rect x="455" y="168" width="150.94" height="18" rx="9.0" ry="9.0" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><circle cx="470" cy="177.0" r="3.2" fill="#ea580c" stroke="none" stroke-width="2"/><text x="480" y="181.0" font-size="8.6" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">MONITORING ROLE</text><line x1="600" y1="182" x2="600" y2="236" stroke="#0a1628" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="440" y="240" width="320" height="84" rx="10" ry="10" fill="#ffffff" stroke="#0a1628" stroke-width="2.2"/><text x="600.0" y="276.0" font-size="13" font-weight="800" font-style="normal" fill="#0a1628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">IoT Traffic Capture</text><text x="600.0" y="296.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">for CIPHER pipeline (software pending)</text><rect x="60" y="350" width="700" height="96" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><text x="410" y="376" font-size="13" font-weight="900" font-style="normal" fill="#7f1d1d" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">DO NOT ADD A SECOND EXTERNAL USB Wi-Fi ADAPTER</text><text x="410" y="400" font-size="10.6" font-weight="600" font-style="normal" fill="#7f1d1d" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">The project budget and design assume exactly one monitor-mode adapter.</text><text x="410" y="420" font-size="10.6" font-weight="600" font-style="normal" fill="#7f1d1d" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Built-in Wi-Fi always stays on the management network — never used for capture.</text></svg>